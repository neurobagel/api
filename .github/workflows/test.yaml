name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Launch test graph
      run: docker compose up -d test_graph

    # # TODO: Check if this is necessary, since the Python dependencies setup also takes some time
    # - name: Sleep to allow graph setup
    #   uses: jakejarvis/wait-action@master
    #   with:
    #     time: '20s'

    - name: Wait for graph setup
      run: |
        timeout=120
        elapsed=0

        until docker compose logs test_graph 2>&1 | grep -q "FINISHED UPLOADING DATA"; do
          if [ "$elapsed" -ge "$timeout" ]; then
            echo "Timed out waiting for graph setup"
            docker compose logs test_graph
            exit 1
          fi

          sleep 1
          elapsed=$((elapsed + 1))
        done

    - name: Check all running and stopped containers
      run: docker ps -a

    - name: Check test graph logs
      run: docker logs api-test_graph-1

    - name: Set up Python 3.10 with uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        uv sync --group dev

    - name: Test with pytest
      run: |
        uv run pytest -m "integration or not integration" --cov --cov-branch --cov-report=xml

    - name: Upload results to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}


