services:

  init_data:
    extends:
      file: recipes/docker-compose.yml
      service: init_data
    volumes:
      - "./neurobagel_examples/data-upload/pheno-bids-derivatives-output:/input_data"
      - "neurobagel_data:/data"

  test_graph:
    extends:
      file: recipes/docker-compose.yml
      service: graph
    volumes:
      - "graphdb_home:/opt/graphdb/home"
      - "./recipes/scripts:/usr/src/neurobagel/scripts"
      - "./recipes/vocab:/usr/src/neurobagel/vocab"
      - "neurobagel_data:/data"
    environment:
      NB_GRAPH_USERNAME: "DBUSER"
      NB_GRAPH_DB: "repositories/my_db"
    secrets:
      - db_admin_password
      - db_user_password

  export_datasets_metadata:
    image: alpine
    depends_on:
      init_data:
        condition: service_completed_successfully
    volumes:
      - "neurobagel_data:/data"
      - ".:/workspace"
    command: >
      sh -c "mkdir -p /workspace/test_graph_data && cp -r /data/. /workspace/test_graph_data/"

secrets:
  db_admin_password:
    file: ./recipes/secrets/NB_GRAPH_ADMIN_PASSWORD.txt
  db_user_password:
    file: ./recipes/secrets/NB_GRAPH_PASSWORD.txt

volumes:
  graphdb_home:
  neurobagel_data:
